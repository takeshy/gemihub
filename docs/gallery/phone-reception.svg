<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1333" width="2700" height="1800" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f2a24" flood-opacity="0.09"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7a70"/></marker>
  </defs>
  <rect width="2000" height="1333" fill="#eef1ea"/>
  <text x="88" y="128" font-size="68" font-weight="700" letter-spacing="-2.4" fill="#1f2d25">AI answers the phone — the server decides</text>
  <text x="90" y="187" font-size="32" fill="#5d6c62">Twilio + Gemini Live take cash bookings and inquiries while you work.</text>
  <text x="90" y="229" font-size="32" fill="#5d6c62">Availability, prices and payment rules stay in server code.</text>
  <circle cx="1764" cy="217" r="7" fill="#6f9a72"/>
  <text x="1910" y="227" font-size="31" font-weight="700" fill="#2d4a3c" text-anchor="end">gemihub</text>

  <!-- Section labels -->
  <text x="90" y="300" font-size="27"><tspan font-weight="700" fill="#2d4a3c">1 · On the call</tspan><tspan fill="#6b7a70" dx="18">Gemini Live talks; the server runs the tools</tspan></text>
  <text x="1232" y="300" font-size="27"><tspan font-weight="700" fill="#2d4a3c">2 · After the call</tspan><tspan fill="#6b7a70" dx="18">same screens as online</tspan></text>

  <!-- Left card -->
  <rect x="90" y="322" width="1100" height="818" rx="20" fill="#fff" stroke="#dfe4dc" filter="url(#sh)"/>
  <g font-size="18" fill="#5d6c62" text-anchor="middle">
    <rect x="118" y="356" width="176" height="176" rx="14" fill="#f6f8f3" stroke="#d6ddd3"/>
    <rect x="190" y="374" width="32" height="54" rx="7" fill="none" stroke="#1f2d25" stroke-width="3.5"/>
    <line x1="200" y1="418" x2="212" y2="418" stroke="#1f2d25" stroke-width="3.5" stroke-linecap="round"/>
    <text x="206" y="464" font-size="23" font-weight="700" fill="#1f2d25">Caller</text>
    <text x="206" y="492">Caller ID = callback</text>
    <text x="206" y="514">number &amp; CRM key</text>

    <rect x="346" y="356" width="206" height="176" rx="14" fill="#f6f8f3" stroke="#d6ddd3"/>
    <text x="449" y="412" font-size="23" font-weight="700" fill="#1f2d25">Twilio</text>
    <text x="449" y="450">Signed webhook</text>
    <text x="449" y="476">Media Streams</text>
    <text x="449" y="502">audio</text>

    <rect x="604" y="356" width="276" height="176" rx="14" fill="#24392f"/>
    <text x="742" y="412" font-size="23" font-weight="700" fill="#fff">gemihub server</text>
    <text x="742" y="450" fill="#c3d6ca">Decides availability,</text>
    <text x="742" y="476" fill="#c3d6ca">prices and payment</text>
    <text x="742" y="502" fill="#c3d6ca">rules</text>

    <rect x="932" y="356" width="232" height="176" rx="14" fill="#f6f8f3" stroke="#d6ddd3"/>
    <text x="1048" y="412" font-size="23" font-weight="700" fill="#1f2d25">Gemini Live</text>
    <text x="1048" y="450">Talks with the caller</text>
    <text x="1048" y="476">Answers from the</text>
    <text x="1048" y="502">published shop info</text>
  </g>
  <g stroke="#6b7a70" stroke-width="2.5" fill="none">
    <line x1="298" y1="444" x2="342" y2="444" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="556" y1="444" x2="600" y2="444" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="884" y1="420" x2="928" y2="420" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="884" y1="472" x2="928" y2="472" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g font-size="14" fill="#6b7a70" text-anchor="middle">
    <text x="320" y="432">call</text><text x="578" y="432">audio</text>
    <text x="906" y="408">audio</text><text x="906" y="496">tools</text>
  </g>

  <line x1="118" y1="574" x2="1162" y2="574" stroke="#e5e9e2" stroke-width="2"/>
  <text x="118" y="622" font-size="17" font-weight="700" fill="#6f9a72" letter-spacing="2">TOOLS THE AI CAN CALL</text>
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" fill="#24392f">
    <rect x="118" y="642" width="250" height="40" rx="8" fill="#eaf0e6"/><text x="134" y="669">check_availability</text>
    <rect x="118" y="694" width="250" height="40" rx="8" fill="#eaf0e6"/><text x="134" y="721">create_booking</text>
    <rect x="118" y="746" width="250" height="40" rx="8" fill="#eaf0e6"/><text x="134" y="773">cancel_booking</text>
    <rect x="118" y="798" width="250" height="40" rx="8" fill="#eaf0e6"/><text x="134" y="825">create_inquiry</text>
    <rect x="118" y="850" width="250" height="40" rx="8" fill="#eaf0e6"/><text x="134" y="877">finish_call</text>
  </g>

  <text x="430" y="622" font-size="17" font-weight="700" fill="#6f9a72" letter-spacing="2">RULES THE AI CANNOT CHANGE</text>
  <g font-size="22" fill="#2b3a31">
    <text x="430" y="670">• Same inventory as online bookings — no double selling</text>
    <text x="430" y="720">• PayPal prepayment on → phone bookings for today only</text>
    <text x="430" y="770">• Discounted replacement slots are never sold by phone</text>
    <text x="430" y="820">• Callers cancel only their own cash phone bookings,</text>
    <text x="450" y="850">before the shop's deadline</text>
    <text x="430" y="900">• No silent hang-up after a failed booking</text>
  </g>
  <rect x="118" y="944" width="1044" height="164" rx="14" fill="#fdf8e8" stroke="#e8d9a8" stroke-dasharray="6 5"/>
  <text x="142" y="990" font-size="21" font-weight="700" fill="#1f2d25">Why phone bookings stay cash and limited</text>
  <text x="142" y="1030" font-size="20" fill="#5d6c62">Caller ID can't prove who is calling, so anything that moves PayPal money stays online.</text>
  <text x="142" y="1062" font-size="20" fill="#5d6c62">The caller never has to say their number, and the AI never reads it aloud.</text>

  <!-- Right card -->
  <rect x="1232" y="322" width="678" height="818" rx="20" fill="#fff" stroke="#dfe4dc" filter="url(#sh)"/>
  <g font-size="20" fill="#5d6c62">
    <g font-size="24" font-weight="700" fill="#1f2d25">
      <text x="1266" y="384">Bookings</text>
      <text x="1266" y="540">Customer CRM</text>
      <text x="1266" y="696">Inquiry board</text>
      <text x="1266" y="852">Call log</text>
      <text x="1266" y="1008">Owner email</text>
    </g>
    <text x="1266" y="420">Cash phone bookings next to online PayPal</text><text x="1266" y="448">bookings, from the same availability</text>
    <text x="1266" y="576">Matched by caller ID; phone-only customers</text><text x="1266" y="604">need no email address</text>
    <text x="1266" y="732">Name, reason and the full call transcript,</text><text x="1266" y="760">ready for a callback</text>
    <text x="1266" y="888">Outcome, duration and a searchable</text><text x="1266" y="916">transcript for every call</text>
    <text x="1266" y="1044">New bookings, cancellations, inquiries</text><text x="1266" y="1072">and unresolved calls</text>
  </g>
  <g stroke="#e5e9e2" stroke-width="2">
    <line x1="1266" y1="486" x2="1876" y2="486"/><line x1="1266" y1="642" x2="1876" y2="642"/>
    <line x1="1266" y1="798" x2="1876" y2="798"/><line x1="1266" y1="954" x2="1876" y2="954"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55605a"/></marker>
  </defs>
  <rect width="1800" height="1200" fill="#f8f4ec"/>
  <text x="60" y="92" font-size="46" font-weight="700" fill="#1f2a24">AI phone reception</text>
  <text x="60" y="142" font-size="26" fill="#3f6b55" font-weight="600">The AI talks. The server decides.</text>
  <text x="1740" y="92" font-size="22" fill="#6b746f" text-anchor="end">Twilio · Gemini Live · gemihub</text>

  <!-- Caller -->
  <rect x="50" y="300" width="250" height="220" rx="18" fill="#fff" stroke="#c9c2b3" stroke-width="2"/>
  <rect x="155" y="326" width="40" height="66" rx="8" fill="none" stroke="#1f2a24" stroke-width="4"/>
  <line x1="168" y1="381" x2="182" y2="381" stroke="#1f2a24" stroke-width="4" stroke-linecap="round"/>
  <text x="175" y="430" font-size="26" font-weight="700" fill="#1f2a24" text-anchor="middle">Caller</text>
  <text x="175" y="464" font-size="18" fill="#55605a" text-anchor="middle">Caller ID = callback</text>
  <text x="175" y="488" font-size="18" fill="#55605a" text-anchor="middle">number &amp; CRM key</text>

  <!-- Twilio -->
  <rect x="370" y="300" width="270" height="220" rx="18" fill="#fff" stroke="#c9c2b3" stroke-width="2"/>
  <text x="505" y="360" font-size="26" font-weight="700" fill="#1f2a24" text-anchor="middle">Twilio</text>
  <text x="505" y="404" font-size="18" fill="#55605a" text-anchor="middle">Signed voice webhook</text>
  <text x="505" y="434" font-size="18" fill="#55605a" text-anchor="middle">Media Streams audio</text>
  <text x="505" y="464" font-size="18" fill="#55605a" text-anchor="middle">over HMAC-signed URL</text>

  <!-- Server -->
  <rect x="710" y="200" width="580" height="570" rx="22" fill="#24392f"/>
  <text x="740" y="252" font-size="28" font-weight="700" fill="#fff">gemihub server</text>
  <text x="740" y="284" font-size="18" fill="#b9cfc3">Decides availability, prices and payment rules</text>
  <text x="740" y="334" font-size="16" font-weight="700" fill="#9fd0b4" letter-spacing="2">TOOLS THE AI CAN CALL</text>
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#fff">
    <rect x="740" y="350" width="250" height="36" rx="8" fill="#355244"/><text x="756" y="375">check_availability</text>
    <rect x="1010" y="350" width="250" height="36" rx="8" fill="#355244"/><text x="1026" y="375">create_booking</text>
    <rect x="740" y="396" width="250" height="36" rx="8" fill="#355244"/><text x="756" y="421">cancel_booking</text>
    <rect x="1010" y="396" width="250" height="36" rx="8" fill="#355244"/><text x="1026" y="421">create_inquiry</text>
    <rect x="740" y="442" width="250" height="36" rx="8" fill="#355244"/><text x="756" y="467">finish_call</text>
  </g>
  <text x="740" y="526" font-size="16" font-weight="700" fill="#9fd0b4" letter-spacing="2">RULES THE AI CANNOT CHANGE</text>
  <g font-size="19" fill="#eef4f0">
    <text x="740" y="562">• Same inventory as online bookings</text>
    <text x="740" y="596">• PayPal prepayment on → phone bookings today only</text>
    <text x="740" y="630">• No discounted replacement slots by phone</text>
    <text x="740" y="664">• Callers cancel only their own cash phone</text>
    <text x="758" y="690">bookings, before the shop's deadline</text>
    <text x="740" y="724">• No silent hang-up after a failed booking</text>
  </g>

  <!-- Gemini Live -->
  <rect x="1380" y="300" width="370" height="220" rx="18" fill="#fff" stroke="#c9c2b3" stroke-width="2"/>
  <text x="1565" y="360" font-size="26" font-weight="700" fill="#1f2a24" text-anchor="middle">Gemini Live</text>
  <text x="1565" y="404" font-size="18" fill="#55605a" text-anchor="middle">Talks with the caller in real time</text>
  <text x="1565" y="434" font-size="18" fill="#55605a" text-anchor="middle">Answers from published shop info</text>
  <text x="1565" y="464" font-size="18" fill="#55605a" text-anchor="middle">Asks the server through tools</text>

  <!-- Flow arrows -->
  <g stroke="#55605a" stroke-width="3" fill="none">
    <line x1="304" y1="410" x2="366" y2="410" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="644" y1="410" x2="706" y2="410" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="1294" y1="380" x2="1376" y2="380" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="1376" y1="440" x2="1294" y2="440" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g font-size="15" fill="#55605a" text-anchor="middle">
    <text x="335" y="396">call</text>
    <text x="675" y="396">audio</text>
    <text x="1335" y="368">audio</text>
    <text x="1335" y="470">tools</text>
  </g>

  <!-- Outputs -->
  <g stroke="#55605a" stroke-width="3" fill="none">
    <line x1="1000" y1="774" x2="1000" y2="840"/>
    <line x1="206" y1="840" x2="1594" y2="840"/>
    <line x1="206" y1="840" x2="206" y2="896" marker-end="url(#a)"/>
    <line x1="553" y1="840" x2="553" y2="896" marker-end="url(#a)"/>
    <line x1="900" y1="840" x2="900" y2="896" marker-end="url(#a)"/>
    <line x1="1247" y1="840" x2="1247" y2="896" marker-end="url(#a)"/>
    <line x1="1594" y1="840" x2="1594" y2="896" marker-end="url(#a)"/>
  </g>
  <g>
    <rect x="60" y="900" width="292" height="190" rx="16" fill="#fff" stroke="#c9c2b3" stroke-width="2"/>
    <rect x="407" y="900" width="292" height="190" rx="16" fill="#fff" stroke="#c9c2b3" stroke-width="2"/>
    <rect x="754" y="900" width="292" height="190" rx="16" fill="#fff" stroke="#c9c2b3" stroke-width="2"/>
    <rect x="1101" y="900" width="292" height="190" rx="16" fill="#fff" stroke="#c9c2b3" stroke-width="2"/>
    <rect x="1448" y="900" width="292" height="190" rx="16" fill="#fff" stroke="#c9c2b3" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <g font-size="23" font-weight="700" fill="#1f2a24">
      <text x="206" y="956">Bookings</text>
      <text x="553" y="956">Customer CRM</text>
      <text x="900" y="956">Inquiry board</text>
      <text x="1247" y="956">Call log</text>
      <text x="1594" y="956">Owner email</text>
    </g>
    <g font-size="17" fill="#55605a">
      <text x="206" y="998">Cash bookings next to</text><text x="206" y="1024">online PayPal bookings</text>
      <text x="553" y="998">Matched by caller ID;</text><text x="553" y="1024">no email needed</text>
      <text x="900" y="998">Name, reason and</text><text x="900" y="1024">full call transcript</text>
      <text x="1247" y="998">Outcome, duration and</text><text x="1247" y="1024">searchable transcript</text>
      <text x="1594" y="998">New bookings, cancellations,</text><text x="1594" y="1024">inquiries, unresolved calls</text>
    </g>
  </g>
  <text x="900" y="1158" font-size="19" fill="#6b746f" text-anchor="middle">Caller ID can't prove who is calling, so anything that would move PayPal money stays online.</text>
</svg>

steps:
  - id: image
    name: gcr.io/cloud-builders/docker
    args: [build, --tag, '${_IMAGE}', .]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}']
  - id: deploy-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ '${_DEPLOY}' != 'true' ]]; then exit 0; fi
        gcloud compute ssh '${_SHARED_INSTANCE}' \
          --project='${_SHARED_PROJECT}' --zone='${_SHARED_ZONE}' \
          --tunnel-through-iap --ssh-key-file=/tmp/build-ssh --quiet \
          --command='sudo python3 /opt/shared-apps/deploy.py --app omaiweb --image ${_IMAGE} && sudo python3 /opt/shared-apps/register.py --persist'
images: ['${_IMAGE}']
substitutions:
  _IMAGE: asia-northeast1-docker.pkg.dev/${PROJECT_ID}/omaiweb/omaiweb:${BUILD_ID}
  _DEPLOY: 'true'
  _SHARED_PROJECT: geminihub-486523
  _SHARED_INSTANCE: shared-apps
  _SHARED_ZONE: asia-northeast1-b
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
